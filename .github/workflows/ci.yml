name: TripNest checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tripnest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: TripNest_Project/TripNest_Project
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tripnest_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            TripNest_Project/TripNest_Project/client/package-lock.json
            TripNest_Project/TripNest_Project/server/package-lock.json
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm run build
      - run: npm test --prefix client
      - run: npm test --prefix server
      - run: npm audit --prefix client --audit-level=high
      - run: npm audit --prefix server --audit-level=high
